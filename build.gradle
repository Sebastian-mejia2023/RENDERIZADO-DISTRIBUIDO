plugins {
    id 'com.zeroc.gradle.ice-builder.slice' version '1.5.0' apply false
}

allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    dependencies {
        implementation 'com.zeroc:ice:3.7.10'
    }
}
